name: Deploy Backend API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'db/**'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit & Accounting Tests
        run: npm run test --workspace=@bizledger/api

      - name: Notice on backend API hosting
        run: |
          echo "::notice title=Backend API Live on Neon::Backend API is deployed and hosted on Neon Functions at https://br-purple-night-bep8owab-api.compute.c-9.us-east-2.aws.neon.tech"
